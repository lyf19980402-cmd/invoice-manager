
name: Build Invoice Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip InvoiceManagerAndroid_Source.zip
          ls -la InvoiceManagerAndroid

      - name: Build debug APK
        working-directory: InvoiceManagerAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: invoice-manager-apk
          path: InvoiceManagerAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
