name: Build Invoice Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o InvoiceManagerAndroid_Source.zip
          ls -la InvoiceManagerAndroid

      - name: Align Java compile target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('InvoiceManagerAndroid/app/build.gradle.kts')
          s = p.read_text()
          marker = '    compileSdk = 35\n'
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              if marker not in s:
                  raise SystemExit('compileSdk line not found')
              s = s.replace(marker, marker + '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: InvoiceManagerAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: invoice-manager-apk
          path: InvoiceManagerAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
